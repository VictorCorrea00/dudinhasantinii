<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dudinha Santinii</title>
  <meta name="description" content="@dudinhasantinii — acesso exclusivo" />
  <meta property="og:title" content="Dudinha Santinii" />
  <meta property="og:image" content="assets/hero_yellow.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ====== 1. GIFT SCREEN (ANTI-BAN PRE-LANDER) ====== */
    .gift-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at 50% 35%, #24131d 0%, #0c080e 70%, #000000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .gift-overlay.hidden {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .gift-card {
      max-width: 370px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 107, 139, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: giftPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      cursor: pointer;
    }

    @keyframes giftPop {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }

    .gift-icon-box {
      position: relative;
      margin-bottom: 18px;
    }

    .gift-emoji {
      font-size: 74px;
      line-height: 1;
      display: inline-block;
      animation: floatGift 2.4s ease-in-out infinite;
      filter: drop-shadow(0 12px 24px rgba(255, 107, 139, 0.55));
    }

    @keyframes floatGift {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-8px) rotate(-4deg) scale(1.06); }
    }

    .gift-glow {
      position: absolute;
      inset: -18px;
      background: radial-gradient(circle, rgba(255, 107, 139, 0.5) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .gift-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 139, 0.18);
      border: 1px solid rgba(255, 107, 139, 0.45);
      color: #ffb8c4;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .gift-title {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .gift-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 22px;
    }

    .gift-btn {
      width: 100%;
      padding: 16px 22px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(255, 77, 109, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .gift-btn:hover {
      transform: translateY(-2px);
    }

    .gift-btn:active {
      transform: scale(0.97);
    }

    .gift-note {
      margin-top: 15px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.45);
    }

    /* ====== 2. MAIN PROFILE PAGE ====== */
    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 32px;
    }

    /* Hero Photo — full portrait, face + body visible */
    .hero-container {
      position: relative;
      width: 100%;
      height: 68vh;
      max-height: 520px;
      background: #000000;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 18%;
      filter: brightness(0.97) contrast(1.04);
    }

    /* Fade to black at bottom */
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.5) 70%,
        #000000 100%
      );
      pointer-events: none;
    }

    /* Profile name overlapping the bottom of the photo */
    .profile-section {
      position: relative;
      margin-top: -72px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 20px 8px;
    }

    .profile-name-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .profile-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.9);
    }

    .verified-badge {
      width: 22px;
      height: 22px;
      color: #647aff;
      flex-shrink: 0;
    }

    .profile-handle {
      font-size: 14.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      margin-bottom: 14px;
    }

    /* ====== PREMIUM VIP CTA CARD ====== */
    .cta-section {
      width: 100%;
      padding: 20px 16px 0;
    }

    .vip-cta-card {
      position: relative;
      width: 100%;
      background: linear-gradient(135deg, rgba(30, 14, 23, 0.96) 0%, rgba(14, 11, 16, 0.98) 100%);
      border: 1px solid rgba(255, 65, 105, 0.4);
      border-radius: 22px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.8), 0 0 32px rgba(255, 45, 85, 0.22);
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }

    .vip-cta-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 90, 130, 0.7);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 45, 85, 0.35);
    }

    .vip-cta-card:active {
      transform: scale(0.975);
    }

    /* Ambient continuous shimmer */
    .cta-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.09),
        transparent
      );
      transform: skewX(-20deg);
      animation: shimmerPass 3.5s infinite;
      pointer-events: none;
    }

    @keyframes shimmerPass {
      0% { left: -100%; }
      35%, 100% { left: 160%; }
    }

    /* Left Thumbnail with the other photo */
    .cta-thumb-wrap {
      position: relative;
      width: 62px;
      height: 62px;
      flex-shrink: 0;
      border-radius: 16px;
    }

    .cta-thumb-img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
      object-position: center 22%;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: block;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }

    .cta-live-badge {
      position: absolute;
      bottom: -3px;
      right: -3px;
      background: linear-gradient(135deg, #ff2d55 0%, #ff5252 100%);
      color: #ffffff;
      font-size: 8.5px;
      font-weight: 900;
      letter-spacing: 0.6px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1.5px solid #000000;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    /* Center Info */
    .cta-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cta-badge-line {
      display: flex;
      align-items: center;
    }

    .cta-tag {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #ff7593;
      background: rgba(255, 45, 85, 0.16);
      border: 1px solid rgba(255, 45, 85, 0.3);
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-block;
      text-transform: uppercase;
    }

    .cta-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cta-sub {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.74);
      line-height: 1.35;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Right Action Arrow */
    .cta-action {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cta-arrow-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .vip-cta-card:hover .cta-arrow-circle {
      background: rgba(255, 45, 85, 0.85);
      border-color: rgba(255, 45, 85, 1);
      transform: translateX(2px);
    }

    .cta-arrow-circle svg {
      width: 17px;
      height: 17px;
      fill: #ffffff;
    }

    /* ====== FOOTER ====== */
    .page-footer {
      margin-top: auto;
      padding: 24px 20px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .legal-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 11.5px;
      color: rgba(255,255,255,0.35);
    }

    .legal-links a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .home-bar {
      width: 125px;
      height: 4px;
      background: rgba(255,255,255,0.7);
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <!-- ====== 1. GIFT SCREEN (ANTI-BAN PRE-LANDER) ====== -->
  <div class="gift-overlay" id="giftOverlay">
    <div class="gift-card" id="giftCard">
      <div class="gift-icon-box" id="giftBox">
        <div class="gift-emoji">🎁</div>
        <div class="gift-glow"></div>
      </div>
      <div class="gift-tag">ACESSO EXCLUSIVO ✨</div>
      <h1 class="gift-title">Toca para resgatar seu presente</h1>
      <p class="gift-subtitle">Clique para desbloquear sua surpresa especial 🤍</p>
      <button class="gift-btn" id="giftBtn" type="button">
        <span>RESGATAR PRESENTE 🎁</span>
      </button>
      <div class="gift-note">🔒 Link privado exclusivo • Acesso imediato</div>
    </div>
  </div>

  <!-- ====== 2. PROFILE PAGE (SIMPLE & DIRECT) ====== -->
  <main class="app-shell">

    <!-- Profile Photo -->
    <div class="hero-container">
      <img src="assets/card_bed.jpg" alt="Dudinha Santinii" class="hero-img" />
      <div class="hero-gradient"></div>
    </div>

    <!-- Profile Name + Handle -->
    <div class="profile-section">
      <div class="profile-name-row">
        <h2 class="profile-name">DUDINHA</h2>
        <svg class="verified-badge" viewBox="0 0 24 24">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.2 14.2l-3.8-3.8 1.41-1.41 2.39 2.39 6.19-6.19 1.41 1.41-7.6 7.6z"/>
        </svg>
      </div>
      <div class="profile-handle">@dudinhasantinii</div>
    </div>

    <!-- ====== PREMIUM VIP CTA BUTTON ====== -->
    <div class="cta-section">
      <div class="vip-cta-card" id="ctaMainBtn" role="button" tabindex="0">
        <!-- Ambient shine sweep -->
        <div class="cta-shimmer"></div>

        <!-- Left photo thumbnail (Yellow top photo) -->
        <div class="cta-thumb-wrap">
          <img src="assets/hero_yellow.jpg" alt="Dudinha VIP" class="cta-thumb-img" />
          <span class="cta-live-badge">VIP</span>
        </div>

        <!-- Center Text -->
        <div class="cta-info">
          <div class="cta-badge-line">
            <span class="cta-tag">ACESSO VIP 🔞</span>
          </div>
          <div class="cta-title">Meus Conteúdos Exclusivos 😈</div>
          <div class="cta-sub">Vem ver o que eu não posto em nenhum outro lugar ✨</div>
        </div>

        <!-- Right Arrow -->
        <div class="cta-action">
          <div class="cta-arrow-circle">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="page-footer">
      <div class="legal-links">
        <a href="#privacy">Privacidade</a>
        <span>|</span>
        <a href="#terms">Termos</a>
      </div>
      <div class="home-bar"></div>
    </footer>

  </main>

  <script>
    const PAYPACK_URL = "https://paypack.fans/dudinhasantini";

    const giftOverlay = document.getElementById('giftOverlay');
    const giftBtn     = document.getElementById('giftBtn');
    const giftCard    = document.getElementById('giftCard');
    const ctaMainBtn  = document.getElementById('ctaMainBtn');

    // Step 1 → Step 2: gift reveals profile page
    function revealPage() {
      giftBtn.innerHTML = '<span>DESBLOQUEADO ✨</span>';
      setTimeout(() => {
        giftOverlay.classList.add('hidden');
      }, 300);
    }

    giftBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      revealPage();
    });

    giftCard.addEventListener('click', (e) => {
      if (!giftBtn.contains(e.target)) revealPage();
    });

    // Step 2 → Step 3: big CTA button opens Paypack in new tab
    ctaMainBtn.addEventListener('click', () => {
      const title = ctaMainBtn.querySelector('.cta-title');
      if (title) title.textContent = 'Abrindo VIP... 💋';
      window.open(PAYPACK_URL, '_blank');
      setTimeout(() => {
        if (title) title.textContent = 'Meus Conteúdos Exclusivos 😈';
      }, 2000);
    });
  </script>
</body>
</html>
