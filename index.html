<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dudinha Santinii</title>
  <meta name="description" content="Dudinha Santinii – exclusive content" />
  <meta property="og:title" content="Dudinha Santinii" />
  <meta property="og:image" content="assets/model.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ====== EDIT THESE COLORS TO CHANGE THE THEME ====== */
    :root {
      --accent: #e8868f;        /* pink haze (like the reference page) */
      --accent-deep: #f2a7ae;   /* soft rose */
      --text-dark: #1d1d1f;
      --card-bg: rgba(255, 255, 255, 0.94);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--accent);
      display: flex;
      flex-direction: column;
    }

    /* Hero photo */
    .hero {
      position: absolute;
      inset: 0 0 auto 0;
      height: 82%;
      background: url('assets/model.jpg') center 20% / cover no-repeat;
      animation: zoom 14s ease-out forwards;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0) 18%,
        rgba(0,0,0,0) 45%,
        rgba(242,167,174,0.35) 60%,
        rgba(232,134,143,0.75) 78%,
        var(--accent) 100%
      );
    }
    @keyframes zoom { from { transform: scale(1.08); } to { transform: scale(1); } }

    /* Top bar */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px;
    }
    .lang {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .lang span {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
    }
    .lang .active { background: #fff; color: var(--text-dark); }

    .share {
      width: 40px; height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid; place-items: center;
      cursor: pointer;
      transition: transform .2s;
    }
    .share:hover { transform: scale(1.08); }
    .share svg { width: 20px; height: 20px; fill: #fff; }

    /* Bottom content */
    .content {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 0 18px 28px;
      text-align: center;
    }
    .name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(38px, 11vw, 52px);
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.35);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .bio {
      font-size: 14px;
      color: var(--text-dark);
      opacity: .75;
      margin-bottom: 20px;
    }

    .links { display: flex; flex-direction: column; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px 10px 10px;
      border-radius: 999px;
      background: var(--card-bg);
      text-decoration: none;
      color: var(--text-dark);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      transition: transform .2s, box-shadow .2s;
      animation: rise .6s ease-out both;
    }
    .link:nth-child(2) { animation-delay: .1s; }
    .link:nth-child(3) { animation-delay: .2s; }
    .link:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 12px 28px rgba(0,0,0,0.18); }
    .link:active { transform: scale(.98); }

    .link img {
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 25%;
      border: 3px solid #fff;
      flex-shrink: 0;
    }
    .link .text { flex: 1; text-align: center; }
    .link .title { font-weight: 800; font-size: 17px; letter-spacing: .5px; }
    .link .sub { font-size: 13.5px; opacity: .75; margin-top: 2px; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .toast {
      position: fixed;
      left: 50%; bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: #111; color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 13px; opacity: 0;
      transition: all .3s; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ====== GIFT BRIDGE / PRE-LANDER OVERLAY ====== */
    .gift-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at 50% 30%, rgba(35, 18, 25, 0.95), rgba(10, 8, 12, 0.98));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .gift-card {
      max-width: 380px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(232, 134, 143, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .gift-icon-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    .gift-emoji {
      font-size: 72px;
      line-height: 1;
      display: inline-block;
      animation: giftFloat 2.6s ease-in-out infinite;
      filter: drop-shadow(0 10px 20px rgba(232, 134, 143, 0.5));
    }

    @keyframes giftFloat {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-10px) rotate(-4deg) scale(1.06); }
    }

    .gift-glow {
      position: absolute;
      inset: -15px;
      background: radial-gradient(circle, rgba(232, 134, 143, 0.45) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .gift-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(232, 134, 143, 0.2);
      border: 1px solid rgba(232, 134, 143, 0.4);
      color: #ffb8c0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .gift-title {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .gift-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .gift-btn {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 117, 140, 0.45);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .gift-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 35px rgba(255, 117, 140, 0.6);
      filter: brightness(1.05);
    }

    .gift-btn:active {
      transform: scale(0.97);
    }

    .gift-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <!-- Bridge screen for IG bot protection / Pre-lander -->
  <div class="gift-overlay" id="giftOverlay">
    <div class="gift-card" id="giftCard">
      <div class="gift-icon-wrapper">
        <div class="gift-emoji">🎁</div>
        <div class="gift-glow"></div>
      </div>
      <div class="gift-badge">EXCLUSIVE ACCESS ✨</div>
      <h2 class="gift-title">Tap to claim your gift</h2>
      <p class="gift-subtitle">Toca para ganar el regalo 🤍</p>
      <button class="gift-btn" id="giftBtn" type="button">
        <span>CLAIM GIFT 🎁</span>
      </button>
      <div class="gift-note">🔒 Instant redirect to private channel</div>
    </div>
  </div>

  <main class="page">
    <div class="hero" role="img" aria-label="Dudinha Santinii"></div>

    <header class="topbar">
      <div class="lang"><span class="active">🇺🇸 EN</span></div>
      <button class="share" id="shareBtn" aria-label="Share">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 21 5a3 3 0 1 0-5.91.7L8.04 9.81A3 3 0 1 0 6 15a2.99 2.99 0 0 0 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></svg>
      </button>
    </header>

    <section class="content">
      <h1 class="name">dudinha santinii</h1>
      <p class="bio">Your favorite girl in white 🤍</p>

      <div class="links">
        <!-- ====== REPLACE href WITH YOUR REAL LINKS ====== -->
        <a class="link" href="https://t.me/dudinhasantini2" target="_blank" rel="noopener">
          <img src="assets/model.jpg" alt="" />
          <div class="text">
            <div class="title">TELEGRAM 🔞</div>
            <div class="sub">Come see what I don't post anywhere else 😈</div>
          </div>
        </a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Link copied!</div>

  <script>
    const TELEGRAM_URL = "https://t.me/dudinhasantini2";
    const giftBtn = document.getElementById('giftBtn');
    const giftCard = document.getElementById('giftCard');

    let redirected = false;
    function claimGift() {
      if (redirected) return;
      redirected = true;
      giftBtn.innerHTML = '<span>OPENING GIFT... 💋</span>';
      giftBtn.style.filter = 'brightness(1.15)';
      
      // Fast redirect to Telegram
      setTimeout(() => {
        window.location.href = TELEGRAM_URL;
      }, 350);
    }

    giftBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      claimGift();
    });

    giftCard.addEventListener('click', () => {
      claimGift();
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const data = { title: document.title, url: location.href };
      if (navigator.share) {
        try { await navigator.share(data); } catch (_) {}
      } else {
        await navigator.clipboard.writeText(location.href);
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      }
    });
  </script>
</body>
</html>
