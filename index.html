<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dudinha Santinii</title>
  <meta name="description" content="Dudinha Santinii – exclusive content" />
  <meta property="og:title" content="Dudinha Santinii" />
  <meta property="og:image" content="assets/model.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ====== EDIT THESE COLORS TO CHANGE THE THEME ====== */
    :root {
      --accent: #e8868f;        /* pink haze (like the reference page) */
      --accent-deep: #f2a7ae;   /* soft rose */
      --text-dark: #1d1d1f;
      --card-bg: rgba(255, 255, 255, 0.94);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #111;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--accent);
      display: flex;
      flex-direction: column;
    }

    /* Hero photo */
    .hero {
      position: absolute;
      inset: 0 0 auto 0;
      height: 82%;
      background: url('assets/model.jpg') center 20% / cover no-repeat;
      animation: zoom 14s ease-out forwards;
    }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0) 18%,
        rgba(0,0,0,0) 45%,
        rgba(242,167,174,0.35) 60%,
        rgba(232,134,143,0.75) 78%,
        var(--accent) 100%
      );
    }
    @keyframes zoom { from { transform: scale(1.08); } to { transform: scale(1); } }

    /* Top bar */
    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 16px;
    }
    .lang {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .lang span {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      padding: 6px 10px;
      border-radius: 999px;
    }
    .lang .active { background: #fff; color: var(--text-dark); }

    .share {
      width: 40px; height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: grid; place-items: center;
      cursor: pointer;
      transition: transform .2s;
    }
    .share:hover { transform: scale(1.08); }
    .share svg { width: 20px; height: 20px; fill: #fff; }

    /* Bottom content */
    .content {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding: 0 18px 28px;
      text-align: center;
    }
    .name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(38px, 11vw, 52px);
      color: #fff;
      text-shadow: 0 2px 18px rgba(0,0,0,0.35);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .bio {
      font-size: 14px;
      color: var(--text-dark);
      opacity: .75;
      margin-bottom: 20px;
    }

    .links { display: flex; flex-direction: column; gap: 12px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 18px 10px 10px;
      border-radius: 999px;
      background: var(--card-bg);
      text-decoration: none;
      color: var(--text-dark);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      transition: transform .2s, box-shadow .2s;
      animation: rise .6s ease-out both;
    }
    .link:nth-child(2) { animation-delay: .1s; }
    .link:nth-child(3) { animation-delay: .2s; }
    .link:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 12px 28px rgba(0,0,0,0.18); }
    .link:active { transform: scale(.98); }

    .link img {
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 25%;
      border: 3px solid #fff;
      flex-shrink: 0;
    }
    .link .text { flex: 1; text-align: center; }
    .link .title { font-weight: 800; font-size: 17px; letter-spacing: .5px; }
    .link .sub { font-size: 13.5px; opacity: .75; margin-top: 2px; }

    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    .toast {
      position: fixed;
      left: 50%; bottom: 30px;
      transform: translateX(-50%) translateY(20px);
      background: #111; color: #fff;
      padding: 10px 18px; border-radius: 999px;
      font-size: 13px; opacity: 0;
      transition: all .3s; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <main class="page">
    <div class="hero" role="img" aria-label="Dudinha Santinii"></div>

    <header class="topbar">
      <div class="lang"><span class="active">🇺🇸 EN</span></div>
      <button class="share" id="shareBtn" aria-label="Share">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 21 5a3 3 0 1 0-5.91.7L8.04 9.81A3 3 0 1 0 6 15a2.99 2.99 0 0 0 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></svg>
      </button>
    </header>

    <section class="content">
      <h1 class="name">dudinha santinii</h1>
      <p class="bio">Your favorite girl in white 🤍</p>

      <div class="links">
        <!-- ====== REPLACE href WITH YOUR REAL LINKS ====== -->
        <a class="link" href="https://t.me/+3t-lBIOja2wyMTYx" target="_blank" rel="noopener">
          <img src="assets/model.jpg" alt="" />
          <div class="text">
            <div class="title">TELEGRAM 🔞</div>
            <div class="sub">Come see what I don't post anywhere else 😈</div>
          </div>
        </a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">Link copied!</div>

  <script>
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const data = { title: document.title, url: location.href };
      if (navigator.share) {
        try { await navigator.share(data); } catch (_) {}
      } else {
        await navigator.clipboard.writeText(location.href);
        const t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1800);
      }
    });
  </script>
</body>
</html>
